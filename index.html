<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PatternForge — Текстуры и 3D визуализация</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="logo-block"><div class="logo">PatternForge</div></div>
<div class="pattern-bar">
    <div class="pattern-buttons" id="patternBarButtons"></div>
    <select id="patternSelectMobile" class="pattern-select-mobile"></select>
</div>
<div class="main-layout">
    <div class="settings-column">
        <div class="settings-panel">
            <div class="setting-group">
                <h3>Генерация</h3>
                <div class="control-row"><label>Масштаб</label><input type="range" id="scale" min="0.5" max="8.0" step="0.01" value="2.5"><span id="scaleVal" class="value-display">2.50</span></div>
                <div class="control-row"><label>Октавы</label><input type="range" id="octaves" min="1" max="6" step="1" value="3"><span id="octavesVal" class="value-display">3</span></div>
                <div class="control-row"><label>Персистенс</label><input type="range" id="persistence" min="0.2" max="0.9" step="0.01" value="0.5"><span id="persistenceVal" class="value-display">0.50</span></div>
                <div class="control-row"><label>Лакунарность</label><input type="range" id="lacunarity" min="1.2" max="3.0" step="0.05" value="2.0"><span id="lacunarityVal" class="value-display">2.00</span></div>
            </div>
            <div class="setting-group">
                <h3>Цветовая палитра</h3>
                <div class="color-palette">
                    <div id="colorListContainer" class="color-list"></div>
                    <button id="addColorBtn" class="add-color-btn">+ Добавить цвет</button>
                    <div class="control-row"><label>Насыщенность</label><input type="range" id="saturation" min="0" max="2.0" step="0.01" value="1.5"><span id="saturationVal" class="value-display">1.50</span></div>
                    <div class="control-row"><label>Смешивание</label><select id="blendMode"><option value="0">Линейное</option><option value="1">Мультипликат.</option></select></div>
                </div>
            </div>
            <div class="setting-group">
                <h3>Трансформы</h3>
                <div class="control-row"><label>Поворот</label><input type="range" id="rotate" min="0" max="360" step="1" value="0"><span id="rotateVal" class="value-display">0°</span></div>
                <div class="control-row"><label>Сдвиг X</label><input type="range" id="offsetX" min="-1" max="1" step="0.01" value="0"><span id="offsetXVal" class="value-display">0.00</span></div>
                <div class="control-row"><label>Сдвиг Y</label><input type="range" id="offsetY" min="-1" max="1" step="0.01" value="0"><span id="offsetYVal" class="value-display">0.00</span></div>
                <div class="control-row"><label>Зеркало</label><select id="mirror"><option value="0">Нет</option><option value="1">X</option><option value="2">Y</option><option value="3">X+Y</option></select></div>
                <div class="control-row"><label>Тайлинг</label><select id="tileToggle"><option value="1">Вкл</option><option value="0">Выкл</option></select></div>
            </div>
            <div class="setting-group">
                <h3>3D модель</h3>
                <select id="geometrySelect">
                    <option value="cube" selected>Куб</option>
                    <option value="torus">Тор-узел</option>
                    <option value="sphere">Сфера</option>
                    <option value="cylinder">Цилиндр</option>
                </select>
                <label class="file-input-label">Загрузить свою модель (glTF/GLB)
                    <input type="file" id="modelFileInput" accept=".gltf,.glb" style="display: none;">
                </label>
                <div id="modelStatus" class="status-msg"></div>
            </div>
            <div class="setting-group">
                <h3>Фоновое изображение</h3>
                <label class="file-input-label">Выбрать фон (подложка)
                    <input type="file" id="bgImageInput" accept="image/*" style="display: none;">
                </label>
                <div class="control-row"><label>Прозрачность фона</label><input type="range" id="bgOpacity" min="0" max="1" step="0.01" value="1.0"><span id="bgOpacityVal" class="value-display">1.00</span></div>
                <div id="bgStatus" class="status-msg"></div>
            </div>
            <div class="setting-group">
                <h3>Наложение картинок (бесшовный тайлинг)</h3>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                    <button id="addOverlayBtn" class="add-images-btn">Добавить изображения</button>
                    <button id="clearOverlayBtn" class="clear-images-btn">Очистить все</button>
                </div>
                <input type="file" id="multiTextureInput" accept="image/*" multiple style="display: none;">
                <div id="overlayImagesList" class="image-badge-list"></div>
                <div class="control-row"><label>Прозрачность слоя</label><input type="range" id="overlayOpacity" min="0" max="1" step="0.01" value="0.7"><span id="opacityVal" class="value-display">0.70</span></div>
                <div class="control-row"><label>Плотность (размер ячейки)</label><input type="range" id="patternElemScale" min="0.3" max="2.5" step="0.02" value="0.95"><span id="patternElemScaleVal" class="value-display">0.95</span></div>
                <div class="checkbox-row"><input type="checkbox" id="enableOverlay" checked><label>Наложить поверх процедурного узора</label></div>
                <div id="overlayStatus" class="status-msg"></div>
            </div>
        </div>
    </div>
    <div class="texture-column">
        <div class="preview-header">2D текстура (колёсико мыши — зум)</div>
        <div id="canvas2d" class="canvas-container"></div>
    </div>
    <div class="view3d-column">
        <div class="preview-header">3D визуализация</div>
        <div id="canvas3d" class="canvas-container"></div>
    </div>
</div>
<div class="global-footer">
    <div class="footer-item"><label>Разрешение</label><select id="exportResolution"><option value="1024">1K</option><option value="2048" selected>2K</option><option value="4096">4K</option></select></div>
    <div class="footer-item"><label>Формат</label><select id="exportFormat"><option value="png">PNG</option><option value="jpg">JPEG</option><option value="svg">SVG</option><option value="pbr">PBR (ZIP)</option></select></div>
    <div class="footer-item"><button id="exportTextureBtn" class="export-btn">Экспорт</button></div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
</script>
<script type="module" src="script.js"></script>
</body>
</html>
